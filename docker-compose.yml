# Local or single-VM deployment: PostgreSQL + the Debo Dairy app (API and web UI on one port).
#   cp .env.docker.example .env      (then edit the secrets)
#   docker compose up --build
# App: http://localhost:4000   API docs: http://localhost:4000/api/docs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: debo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: debo_dairy
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debo -d debo_dairy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://debo:${POSTGRES_PASSWORD}@db:5432/debo_dairy
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      TELEBIRR_MODE: ${TELEBIRR_MODE:-sandbox}
      TELEBIRR_APP_ID: ${TELEBIRR_APP_ID:-}
      TELEBIRR_APP_KEY: ${TELEBIRR_APP_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Debo Admin}
    volumes:
      - uploads:/data/uploads

volumes:
  dbdata:
  uploads:
